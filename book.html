<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Book a Car | DWON Cars (Demo)</title>
  <link rel="icon" href="images/logo/dwon-emblem.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Saira+Stencil+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="book">
  <div id="header"></div>

  <section class="section">
    <div class="container">
      <div class="section-title">
        <div class="eyebrow">« Reserve Your Ride »</div>
        <h2 class="heading"><span class="red">Book</span> Your Car</h2>
        <p>See how booking works: pick a car and dates to get a price estimate. (Demo only, no real bookings.)</p>
      </div>

      <div class="book-grid">
        <!-- Form -->
        <form class="dark-card form" id="bookForm">
          <label>Full name <input id="bName" required placeholder="Your name"></label>
          <label>Phone / WhatsApp number <input id="bPhone" type="tel" required placeholder="+971 ..."></label>
          <label>Choose car <select id="bCar" required></select></label>
          <div class="two">
            <label>Delivery date <input id="bFrom" type="date" required></label>
            <label>Return date <input id="bTo" type="date" required></label>
          </div>
          <label>Deliver the car to <select id="bPlace"></select></label>
          <label class="check"><input id="bDriver" type="checkbox"> I want a chauffeur (driver) too</label>
          <label>Delivery address / anything else? (optional) <textarea id="bNotes" rows="3" placeholder="Hotel name, building, area..."></textarea></label>
          <button class="btn btn-red btn-lg" type="submit"><span class="icon">event_available</span> Book Now (demo)</button>
          <p class="muted" style="font-size:12px;margin:0">Demo website: this form does not send anything.</p>
        </form>

        <!-- Summary -->
        <div class="dark-card summary">
          <div class="eyebrow" style="margin-bottom:12px">Booking summary</div>
          <img id="sumImg" alt="">
          <h3 class="heading" id="sumName" style="font-size:26px;margin:14px 0 4px">Choose a car</h3>
          <div class="muted" id="sumDays"></div>
          <div class="price" id="sumTotal" style="font-size:36px"></div>
          <p class="muted" style="font-size:12px">Security deposit is refundable. Fuel and Salik (tolls) are charged separately.</p>
        </div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <div id="footer"></div>
  <script src="js/config.js"></script>
  <script src="js/cars-data.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
